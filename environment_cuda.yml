name: ai-helse-cuda
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  # Python
  - python=3.12
  - pip

  # Grunnleggende dataarbeid og visualisering
  - numpy>=1.26.0,<2.4
  - pandas>=2.1.0
  - scipy>=1.11.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  # Klassisk maskinlæring
  - scikit-learn>=1.3.0
  - scikit-image>=0.22.0
  - xgboost>=2.0.0
  - lightgbm>=4.1.0

  # Dyplæring og bildearbeid
  # Denne varianten er ment for Linux/Windows med NVIDIA-GPU.
  # På Mac eller CPU-only, bruk environment.yml.
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=12.1
  - opencv>=4.8.0
  - pillow>=10.0.0

  # Notebook-miljø
  - jupyterlab>=4.0.0
  - notebook>=7.0.0
  - ipywidgets>=8.1.0
  - ipykernel>=6.26.0

  # Nyttige hjelpepakker
  - openpyxl>=3.1.0
  - python-dotenv>=1.0.0
  - pyyaml>=6.0
  - tqdm>=4.66.0

  # Utvikling og testing
  - black>=23.0.0
  - flake8>=6.0.0
  - pytest>=7.4.0

  - pip:
      # Språkmodeller og API-bruk
      - google-genai>=1.75,<3
      - openai>=1.0.0
      - anthropic>=0.8.0
      - transformers>=4.36.0
      - tiktoken>=0.5.0

      # Kursnotebooks og fordypning
      - crewai>=1.14,<2
      - shap>=0.44.0
      - lime>=0.2.0.1
      - nibabel>=5.0.0
      - nilearn>=0.10.0
      - wfdb>=4.1.0
      - torchsummary>=1.5.1
      - torchinfo>=1.8
      - faker
      - kaggle>=1.5.0